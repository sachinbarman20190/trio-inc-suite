<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
  <!-- Triangle node for 3-member Trio symbol -->
  <polygon points="256,120 370,320 142,320" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round"/>
  <!-- 3 Nodes -->
  <circle cx="256" cy="120" r="28" fill="#38bdf8" />
  <circle cx="370" cy="320" r="28" fill="#818cf8" />
  <circle cx="142" cy="320" r="28" fill="#0284c7" />
  <!-- Center POD Garment / Symbol -->
  <text x="256" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">TRIO</text>
  <text x="256" y="300" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="4">POD HUB</text>
</svg>
