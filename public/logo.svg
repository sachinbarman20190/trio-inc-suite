<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020814" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#01040a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Steel Rim Gradient (Light angle from top-left) -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0bcc8"/>
      <stop offset="15%" stop-color="#e8f0f8"/>
      <stop offset="35%" stop-color="#5a6878"/>
      <stop offset="50%" stop-color="#2a3340"/>
      <stop offset="70%" stop-color="#8c9baa"/>
      <stop offset="85%" stop-color="#dce6f0"/>
      <stop offset="100%" stop-color="#3c4856"/>
    </linearGradient>

    <!-- Inner Dark Brushed Steel Ring -->
    <radialGradient id="innerPlate" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182232"/>
      <stop offset="50%" stop-color="#0d131d"/>
      <stop offset="85%" stop-color="#06090e"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>

    <!-- Electric Cyan Neon Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="superCyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="glow1"/>
      <feGaussianBlur stdDeviation="28" result="glow2"/>
      <feGaussianBlur stdDeviation="45" result="glow3"/>
      <feMerge>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Facet Gradients for the Triangular Knot -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c5d2e0"/>
      <stop offset="60%" stop-color="#708296"/>
      <stop offset="100%" stop-color="#303b48"/>
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242d38"/>
      <stop offset="40%" stop-color="#4e5c6e"/>
      <stop offset="80%" stop-color="#9cb0c5"/>
      <stop offset="100%" stop-color="#d8e5f2"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2ecf7"/>
      <stop offset="30%" stop-color="#90a2b5"/>
      <stop offset="70%" stop-color="#3d4957"/>
      <stop offset="100%" stop-color="#1a222c"/>
    </linearGradient>

    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="50%" stop-color="#2c3746"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </linearGradient>

    <!-- Metallic Chrome Lettering Gradient -->
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c8d6e5"/>
      <stop offset="50%" stop-color="#607185"/>
      <stop offset="52%" stop-color="#202a36"/>
      <stop offset="80%" stop-color="#889bb0"/>
      <stop offset="100%" stop-color="#d4e1ee"/>
    </linearGradient>

    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Outer Cyan Ambient Bloom -->
  <circle cx="512" cy="512" r="435" fill="none" stroke="#00d2ff" stroke-width="12" opacity="0.4" filter="url(#superCyanGlow)"/>

  <!-- OUTER METALLIC STEEL BEZEL -->
  <circle cx="512" cy="512" r="430" fill="url(#metalRim)" filter="url(#metalShadow)"/>
  
  <!-- Outer Bevel Groove -->
  <circle cx="512" cy="512" r="424" fill="none" stroke="#101722" stroke-width="3"/>
  <circle cx="512" cy="512" r="421" fill="none" stroke="#e0ecf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Stepped Down Trench -->
  <circle cx="512" cy="512" r="396" fill="#070b10" stroke="#1e2733" stroke-width="4"/>

  <!-- Intense Cyan Ring Glow Channel inside the Metallic Bezel -->
  <circle cx="512" cy="512" r="388" fill="none" stroke="#00f0ff" stroke-width="5" filter="url(#superCyanGlow)" opacity="0.95"/>
  <circle cx="512" cy="512" r="388" fill="none" stroke="#e0ffff" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Inner Plate Bevel Ring -->
  <circle cx="512" cy="512" r="366" fill="url(#innerPlate)" stroke="#2b3848" stroke-width="6"/>
  <circle cx="512" cy="512" r="364" fill="none" stroke="#080d14" stroke-width="2"/>

  <!-- Subtle Mechanical Seams & Notches on Outer Ring (at 12, 3, 6, 9 o'clock) -->
  <rect x="508" y="78" width="8" height="34" rx="2" fill="#141c26" stroke="#4b5c70" stroke-width="1"/>
  <rect x="509" y="80" width="6" height="30" rx="1" fill="#00f0ff" opacity="0.8" filter="url(#neonGlow)"/>

  <rect x="912" y="508" width="34" height="8" rx="2" fill="#141c26" stroke="#4b5c70" stroke-width="1"/>
  <rect x="914" y="509" width="30" height="6" rx="1" fill="#00f0ff" opacity="0.8" filter="url(#neonGlow)"/>

  <rect x="508" y="912" width="8" height="34" rx="2" fill="#141c26" stroke="#4b5c70" stroke-width="1"/>
  <rect x="509" y="914" width="6" height="30" rx="1" fill="#00f0ff" opacity="0.8" filter="url(#neonGlow)"/>

  <rect x="78" y="508" width="34" height="8" rx="2" fill="#141c26" stroke="#4b5c70" stroke-width="1"/>
  <rect x="80" y="509" width="30" height="6" rx="1" fill="#00f0ff" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Additional mechanical side notches -->
  <rect x="135" y="415" width="8" height="24" rx="2" fill="#243040" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
  <rect x="881" y="415" width="8" height="24" rx="2" fill="#243040" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>

  <!-- ========================================================== -->
  <!-- CENTER EMBLEM: FUTURISTIC INTERLOCKING TRIANGULAR KNOT -->
  <!-- ========================================================== -->

  <!-- Glowing Cyan Underlay / Backlight for the Knot -->
  <g filter="url(#superCyanGlow)" opacity="0.95">
    <!-- Underglow triangles and channels -->
    <path d="M 512 110 L 785 585 L 239 585 Z" fill="none" stroke="#00f0ff" stroke-width="26" stroke-linejoin="round"/>
    <path d="M 512 140 L 755 565 L 269 565 Z" fill="none" stroke="#00f0ff" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="512,185 715,545 309,545" fill="#002d44" opacity="0.6"/>
  </g>

  <!-- Knot Shadow onto the Plate -->
  <g filter="url(#metalShadow)">
    <!-- THE THREE INTERLOCKING METALLIC BLADES (TRIQUETRA / DELTA KNOT) -->

    <!-- Blade 1: Top Apex descending to right -->
    <polygon points="512,118 566,224 456,412 368,362 482,176" fill="url(#facetTop)"/>
    <polygon points="512,118 482,176 368,362 308,328 440,118" fill="url(#facetDark)"/>
    <!-- Blade 1 Main face -->
    <polygon points="512,118 642,352 546,396 456,236" fill="url(#facetRight)"/>
    <!-- Highlight blade edge -->
    <line x1="512" y1="118" x2="642" y2="352" stroke="#ffffff" stroke-width="3"/>

    <!-- Blade 2: Bottom Right ascending/crossing into center -->
    <polygon points="796,575 684,575 510,470 546,375 730,480" fill="url(#facetLeft)"/>
    <polygon points="796,575 730,480 546,375 562,310 796,448" fill="url(#facetTop)"/>
    <!-- Blade 2 Under-bevel -->
    <polygon points="796,575 640,575 490,488 510,470" fill="url(#facetDark)"/>
    <!-- Highlight edge -->
    <line x1="796" y1="575" x2="562" y2="310" stroke="#e6f5ff" stroke-width="3"/>

    <!-- Blade 3: Bottom Left ascending to center and base cross -->
    <polygon points="228,575 352,360 440,410 326,575" fill="url(#facetLeft)"/>
    <polygon points="228,575 326,575 572,575 600,518 316,518" fill="url(#facetTop)"/>
    <polygon points="228,575 316,518 600,518 630,575 228,575" fill="url(#facetDark)"/>
    <!-- Highlight edge -->
    <line x1="228" y1="575" x2="352" y2="360" stroke="#ffffff" stroke-width="3"/>

    <!-- Center Interlock Triangle Core (Chamfered Facets) -->
    <polygon points="512,285 588,420 436,420" fill="url(#facetDark)" stroke="#00f0ff" stroke-width="2"/>
    <polygon points="512,285 588,420 546,445 478,445" fill="url(#facetRight)"/>
    <polygon points="512,285 478,445 436,420" fill="url(#facetTop)"/>

    <!-- High-intensity Cyan Light Leaks in Knot Crevices -->
    <path d="M 456,412 L 512,320 L 568,412 Z" fill="#00ffff" opacity="0.9" filter="url(#neonGlow)"/>
    <line x1="368" y1="362" x2="456" y2="412" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
    <line x1="546" y1="375" x2="630" y2="425" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
    <line x1="436" y1="420" x2="572" y2="575" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>
  </g>

  <!-- ========================================================== -->
  <!-- TYPOGRAPHY: "TRIO" & "— INC. —" METALLIC ENGRAVED -->
  <!-- ========================================================== -->

  <!-- Electric Cyan Underglow behind TRIO -->
  <g filter="url(#superCyanGlow)" opacity="0.8">
    <text x="512" y="728" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="118" 
          font-weight="900" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="#00e5ff">
      TRIO
    </text>
  </g>

  <!-- Main "TRIO" Metallic Chrome Chamfered Text -->
  <g filter="url(#metalShadow)">
    <text x="512" y="726" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="118" 
          font-weight="900" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="url(#chromeText)"
          stroke="#101924"
          stroke-width="4">
      TRIO
    </text>
    <!-- Crisp White/Silver Top Bevel Stroke -->
    <text x="512" y="725" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="118" 
          font-weight="900" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="none"
          stroke="#eef6ff"
          stroke-width="1.5"
          opacity="0.8">
      TRIO
    </text>
  </g>

  <!-- Cyan Glow and Metallic Accent Line with "— INC. —" -->
  <!-- Left Cyan Line -->
  <line x1="310" y1="765" x2="400" y2="765" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="310" y1="765" x2="400" y2="765" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- "INC." Subtitle -->
  <text x="512" y="776" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="14" 
        text-anchor="middle" 
        fill="#c4d5e8"
        filter="url(#metalShadow)">
    INC.
  </text>

  <!-- Right Cyan Line -->
  <line x1="624" y1="765" x2="714" y2="765" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="624" y1="765" x2="714" y2="765" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom Mini Cyan Status LED Dot/Bar -->
  <rect x="492" y="848" width="40" height="6" rx="3" fill="#00f0ff" filter="url(#neonGlow)"/>
  <rect x="496" y="849" width="32" height="4" rx="2" fill="#e0ffff"/>
</svg>